<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letters</title>

    <link rel="icon" type="image/png" href="../resources/images/valentine heart.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/paper.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/config.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/main.js"></script>
</head>
<body>

    <div id="letters-section" class="container p-5 d-flex flex-column gap-2">
        <!--The messages goes here-->
    </div>

    <div id="input-form" class="container rounded p-5 justify-content-end gap-3">
            <textarea name="input-letters" id="input-letters" class="form-control" placeholder="Wanna leave a message?"></textarea>
            <button id="send-btn" class="btn btn-outline-danger col-3">Send letters</button>
    </div>

    <div class="modal fade" id="message-format-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Quick reminder</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Start your message with your tag, like <strong>@Raphael</strong>, then your message.
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
